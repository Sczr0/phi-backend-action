name: Unpack APK and Distribute Files

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: '输入要测试的APK下载链接'
        required: true
  repository_dispatch:
    types: [new_phigros_version]

permissions:
  contents: write

jobs:
  unpack-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 设置超时，防止挂死耗尽额度

    steps:
      # 1. 清理磁盘空间 (关键步骤)
      # GitHub Runner 预装了很多东西，解包大游戏很容易爆磁盘
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean

      # 2. 检出当前代码
      - name: Checkout Main Repo
        uses: actions/checkout@v4

      # 3. 安装系统依赖 (合并安装以节省时间)
      # 必须安装 aria2 才能配合新的 Python 脚本使用
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvorbis-dev libogg-dev aria2

      # 4. Python 环境
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # 自动缓存 pip 依赖

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. 运行主脚本
      - name: Run Main Orchestrator Script
        env:
          APK_DOWNLOAD_URL: ${{ github.event.inputs.apk_url || github.event.client_payload.download_url }}
          # 增加 BUFFER设置，防止 python print 导致 actions 卡死
          PYTHONUNBUFFERED: "1" 
        run: |
          python main.py

      # 6. 配置 Git 用户
      - name: Configure Git Global
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 7. 整理产物并推送到当前仓库
      - name: Commit Artifacts to This Repository
        run: |
          echo "Organizing artifacts..."
          rm -rf output
          mkdir -p output

          # 安全移动：如果文件夹存在才移动
          for dir in info illustration illustrationBlur illustrationLowRes avatar music chart; do
            if [ -d "$dir" ]; then
              mv "$dir" ./output/
            fi
          done
          
          git add output/

          if ! git diff --staged --quiet; then
            echo "Changes detected, committing..."
            git commit -m "chore(artifacts): 自动归档产物 (版本 ${{ github.event.client_payload.version_name || 'MANUAL' }})"
            # 使用 pull --rebase 防止多人提交冲突
            git pull --rebase
            git push
          else
            echo "No changes detected."
          fi

      # 8. 推送图片资源 (使用浅克隆优化速度)
      - name: Push Illustrations to phi-plugin-ill
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Cloning target repo (Shallow)..."
          # --depth 1 只拉取最后一次提交，速度极快
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Sczr0/phi-plugin-ill.git" ill_repo
          
          echo "Syncing files..."
          # 确保目标父目录存在
          mkdir -p ill_repo/ill ill_repo/illBlur ill_repo/illLow ill_repo/avatar

          # 只有当源目录存在时才执行 rsync，防止报错
          [ -d "./output/illustration/" ] && rsync -av --delete ./output/illustration/ ill_repo/ill/
          [ -d "./output/illustrationBlur/" ] && rsync -av --delete ./output/illustrationBlur/ ill_repo/illBlur/
          [ -d "./output/illustrationLowRes/" ] && rsync -av --delete ./output/illustrationLowRes/ ill_repo/illLow/
          [ -d "./output/avatar/" ] && rsync -av --delete ./output/avatar/ ill_repo/avatar/
          
          cd ill_repo
          if ! git diff --quiet; then
            git add .
            git commit -m "feat(ill): 自动更新资源 (版本 ${{ github.event.client_payload.version_name || 'MANUAL' }})"
            git push
          else
            echo "No changes in illustrations."
          fi

      # 9. 推送数据文件 (使用浅克隆优化速度)
      - name: Push Data to Phi-Backend
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Cloning target repo (Shallow)..."
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Sczr0/Phi-Backend.git" backend_repo
          
          echo "Syncing data..."
          mkdir -p backend_repo/info
          
          if [ -d "./output/info/" ]; then
            rsync -av ./output/info/ backend_repo/info/
          fi
          
          cd backend_repo
          if ! git diff --quiet; then
            git add .
            git commit -m "feat(info): 自动更新数据 (版本 ${{ github.event.client_payload.version_name || 'MANUAL' }})"
            git push
          else
            echo "No changes in data."
          fi